<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="noindex" /><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com" /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/admin/admin.css" /><script src="/admin/admin.js"></script><title>Admin Login · Rocket Money</title></head>
<body class="min-h-screen flex items-center justify-center p-4">
  <form id="form" class="card w-full max-w-sm p-8 space-y-5">
    <div class="text-center">
      <div class="text-4xl mb-2">🚀</div>
      <h1 class="text-xl font-bold">Rocket Money <span class="text-[#00FF88]">Admin</span></h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to manage the platform</p>
    </div>
    <div><label class="text-sm text-gray-400">Username</label><input id="username" class="input mt-1" autocomplete="username" required /></div>
    <div><label class="text-sm text-gray-400">Password</label><input id="password" type="password" class="input mt-1" autocomplete="current-password" required /></div>
    <p id="error" class="text-red-400 text-sm hidden"></p>
    <button id="submit" class="btn w-full py-3">Sign in</button>
  </form>
  <script>
    if (RM.token()) location.href = '/admin/index.html';
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submit'), err = document.getElementById('error');
      btn.disabled = true; btn.textContent = 'Signing in…'; err.classList.add('hidden');
      try {
        const data = await RM.api('/login', { method: 'POST', body: { username: username.value.trim(), password: password.value } });
        RM.setToken(data.token);
        location.href = '/admin/index.html';
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove('hidden');
      } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
    });
  </script>
</body></html>
